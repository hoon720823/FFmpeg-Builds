name: Build FFmpeg

# Manual-only trigger — push / schedule 제거.
# 빌드 시작은 Actions 탭의 'Run workflow' 버튼 (workflow_dispatch) 만 사용.
# 빌드 성공 시 모든 OS artifact (win64/winarm64/linux64/linuxarm64) 가 자동 release publish 된다.
# release 를 건너뛰려면 buildOnly=true 로 trigger.
on:
  workflow_dispatch:
    inputs:
      buildOnly:
        description: 'Only build ffmpeg (skip release publish)'
        type: boolean
        default: false
        required: false

env:
  DOCKER_BUILDKIT: 1

jobs:
  pre_check:
    name: Pre Checks
    if: ${{ github.event.inputs.buildOnly != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Repo Check
        if: ${{ github.event_name == 'schedule' }}
        run: |
          if [[ "$GITHUB_REPOSITORY" != "BtbN/FFmpeg-Builds" ]]; then
            echo "When forking this repository to make your own builds, you have to adjust this check."
            echo "When doing so make sure to randomize the scheduled cron time above, in order to spread out the various build times as much as possible."
            echo "This has been put in place due to the enormous amounts of traffic hundreds/thousands of parallel builds can cause on external infrastructure."
            echo "# To enable scheduled builds, please make the following 2 edits to [.github/workflows/build.yml](https://github.com/$GITHUB_REPOSITORY/edit/$GITHUB_REF_NAME/.github/workflows/build.yml):" >> "$GITHUB_STEP_SUMMARY"
            echo '1. **IMPORTANT:** Change the 2 numbers on the `cron:` line. The first number must be between 0 and 59, and the second must be between 0 and 23.' >> "$GITHUB_STEP_SUMMARY"
            echo '2. Use `find and replace` (ctrl+f) to replace `BtbN/FFmpeg-Builds` with your repository name' >> "$GITHUB_STEP_SUMMARY"
            echo  >> "$GITHUB_STEP_SUMMARY"
            echo "This safeguard exists to  avoid overwhelming important open-source infrastructure (see https://github.com/BtbN/FFmpeg-Builds/issues/278)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          exit 0
  build_base:
    name: Build base image
    if: ${{ github.event.inputs.buildOnly != 'true' }}
    needs: pre_check
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest,ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Free Disk-Space
        run: df -h && sudo apt-get clean && docker system prune -a -f && sudo rm -rf /opt/ghc /usr/local/.ghcup /usr/local/lib/android && df -h
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: .github/buildkit.toml
      - name: Login to Docker
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image Name
        id: imagename
        run: |
          IMG="${GITHUB_REPOSITORY,,}/base"
          IMG="${IMG// /-}"
          echo "name=ghcr.io/${IMG}" >> $GITHUB_OUTPUT
          echo "rawname=${IMG#*/}" >> $GITHUB_OUTPUT
      - name: Stop Commands
        run: T="$(echo -n ${{ github.token }} | sha256sum | head -c 64)" && echo -e "::add-mask::${T}\n::stop-commands::${T}"
      - name: Build target base image
        uses: docker/build-push-action@v7
        with:
          context: images/base
          pull: true
          push: true
          provenance: false
          tags: ${{ steps.imagename.outputs.name }}:latest${{ (contains(matrix.runner, 'arm') && '-arm') || '' }}
          cache-to: type=registry,mode=max,ref=${{ steps.imagename.outputs.name }}:cache${{ (contains(matrix.runner, 'arm') && '-arm') || '' }}
          cache-from: type=registry,ref=${{ steps.imagename.outputs.name }}:cache${{ (contains(matrix.runner, 'arm') && '-arm') || '' }}
      - name: Get download cache key
        if: ${{ !cancelled() && !contains(matrix.runner, 'arm') }}
        id: dl_cache
        run: |
          echo "dltagname=$(./util/get_dl_cache_tag.sh)" >> $GITHUB_OUTPUT
      - name: Cache
        if: ${{ !cancelled() && !contains(matrix.runner, 'arm') }}
        uses: actions/cache@v5
        with:
          path: .cache/downloads
          key: download-cache-${{ steps.dl_cache.outputs.dltagname }}
          restore-keys: |
            download-cache-
      - name: Update Cache
        if: ${{ !cancelled() && !contains(matrix.runner, 'arm') }}
        run: |
          set -e
          ./download.sh
          ./util/clean_cache.sh
          tar czf .cache/cache.tar.gz .cache/downloads/*
      - name: Upload cache artifact
        if: ${{ !cancelled() && !contains(matrix.runner, 'arm') }}
        uses: actions/upload-artifact@v7
        with:
          name: download-cache
          overwrite: true
          path: .cache/cache.tar.gz
      - name: Cleanup
        continue-on-error: true
        uses: BtbN/delete-untagged-ghcr-action@main
        with:
          token: ${{ github.token }}
          package_name: ${{ steps.imagename.outputs.rawname }}
          repository_owner: ${{ github.repository_owner }}
          repository: ${{ github.repository }}
          owner_type: user
          untagged_only: true
  build_target_bases:
    name: Build target base image
    if: ${{ github.event.inputs.buildOnly != 'true' }}
    needs: build_base
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [win64,winarm64,linux64,linuxarm64]
    steps:
      - name: Free Disk-Space
        run: df -h && sudo apt-get clean && docker system prune -a -f && sudo rm -rf /opt/ghc /usr/local/.ghcup /usr/local/lib/android && df -h
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: .github/buildkit.toml
      - name: Login to Docker
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image Name
        id: imagename
        run: |
          IMG="${GITHUB_REPOSITORY,,}/base-${{ matrix.target }}"
          IMG="${IMG// /-}"
          echo "name=ghcr.io/${IMG}" >> $GITHUB_OUTPUT
          echo "rawname=${IMG#*/}" >> $GITHUB_OUTPUT
          echo "gh_repo=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
      - name: Stop Commands
        run: T="$(echo -n ${{ github.token }} | sha256sum | head -c 64)" && echo -e "::add-mask::${T}\n::stop-commands::${T}"
      - name: Build target base image
        uses: docker/build-push-action@v7
        with:
          context: images/base-${{ matrix.target }}
          pull: true
          push: true
          provenance: false
          tags: ${{ steps.imagename.outputs.name }}:latest
          cache-to: type=registry,mode=max,ref=${{ steps.imagename.outputs.name }}:cache
          cache-from: type=registry,ref=${{ steps.imagename.outputs.name }}:cache
          build-args: |
            GH_REPO=ghcr.io/${{ steps.imagename.outputs.gh_repo }}
      - name: Cleanup
        continue-on-error: true
        uses: BtbN/delete-untagged-ghcr-action@main
        with:
          token: ${{ github.token }}
          package_name: ${{ steps.imagename.outputs.rawname }}
          repository_owner: ${{ github.repository_owner }}
          repository: ${{ github.repository }}
          owner_type: user
          untagged_only: true
  build_targets:
    name: Build target-variant image
    if: ${{ github.event.inputs.buildOnly != 'true' }}
    needs: build_target_bases
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [win64,winarm64,linux64,linuxarm64]
        variant: [gpl-shared 8.1]
    steps:
      - name: Free Disk-Space
        run: df -h && sudo apt-get clean && docker system prune -a -f && sudo rm -rf /opt/ghc /usr/local/.ghcup /usr/local/lib/android && df -h
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: .github/buildkit.toml
      - name: Login to Docker
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image Name
        id: imagename
        run: |
          IMG="${GITHUB_REPOSITORY,,}/${{ matrix.target }}-${{ matrix.variant }}"
          IMG="${IMG// /-}"
          echo "name=ghcr.io/${IMG}" >> $GITHUB_OUTPUT
          echo "rawname=${IMG#*/}" >> $GITHUB_OUTPUT
      - name: Get download cache key
        id: dl_cache
        run: |
          echo "dltagname=$(./util/get_dl_cache_tag.sh)" >> $GITHUB_OUTPUT
      - name: Stop Commands
        run: T="$(echo -n ${{ github.token }} | sha256sum | head -c 64)" && echo -e "::add-mask::${T}\n::stop-commands::${T}"
      - name: Generate Dockerfile
        run: ./generate.sh ${{ matrix.target }} ${{ matrix.variant }}
      - name: Cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/downloads
          key: download-cache-${{ steps.dl_cache.outputs.dltagname }}
          fail-on-cache-miss: true
      - name: Build target base image
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          push: true
          provenance: false
          tags: ${{ steps.imagename.outputs.name }}:latest
          cache-to: type=registry,mode=max,ref=${{ steps.imagename.outputs.name }}:cache
          cache-from: type=registry,ref=${{ steps.imagename.outputs.name }}:cache
      - name: Cleanup
        continue-on-error: true
        uses: BtbN/delete-untagged-ghcr-action@main
        with:
          token: ${{ github.token }}
          package_name: ${{ steps.imagename.outputs.rawname }}
          repository_owner: ${{ github.repository_owner }}
          repository: ${{ github.repository }}
          owner_type: user
          untagged_only: true
  build_ffmpeg:
    name: Build ffmpeg
    if: ${{ ( github.event.inputs.buildOnly == 'true' && !cancelled() ) || success() }}
    needs: build_targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [win64,winarm64,linux64,linuxarm64]
        variant: [gpl-shared 8.1]
    steps:
      - name: Free Disk-Space
        run: df -h && sudo apt-get clean && docker system prune -a -f && sudo rm -rf /opt/ghc /usr/local/.ghcup /usr/local/lib/android && df -h
      - name: Checkout
        uses: actions/checkout@v6
      - name: Login to Docker
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build ffmpeg
        env:
          FFMPEG_REPO: https://x-access-token:${{ secrets.FFMPEG_PAT }}@github.com/hoon720823/ffmpeg-patch.git
          GIT_BRANCH: master
        run: |
          T="$(echo -n ${{ github.token }} | sha256sum | head -c 64)" && echo -e "::add-mask::${T}\n::stop-commands::${T}"
          ./build.sh ${{ matrix.target }} ${{ matrix.variant }}
      - name: Replace spaces in string
        id: strs
        run: |
          SLUG="${{ matrix.target }}-${{ matrix.variant }}"
          echo "artifact_slug=${SLUG// /-}" >> $GITHUB_OUTPUT
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-${{ steps.strs.outputs.artifact_slug }}
          overwrite: true
          path: artifacts/*
  build_ffmpeg_macos:
    name: Build ffmpeg (macOS, gpl-shared 8.1)
    # macOS 는 docker cross-compile 불가 — macos-13 (intel) + macos-14 (Apple Silicon) native build.
    # 기존 build_targets / build_base 에 의존하지 않음 (별 path).
    # 실패해도 publish_release 는 4개 OS (linux/win) artifact 만으로 진행 — needs 에 추가하되 result 검증은 안 함.
    if: ${{ github.event.inputs.buildOnly == 'true' || success() }}
    needs: pre_check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-13, arch: amd64 }
          - { runner: macos-14, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install dependencies (Homebrew)
        run: |
          brew update
          # Note: SRT formula in Homebrew is "srt" not "libsrt"
          brew install pkg-config nasm yasm zeromq srt x264 x265 \
            libvpx opus libvorbis freetype harfbuzz fribidi libxml2 \
            dav1d svt-av1
      - name: Build ffmpeg (native)
        env:
          FFMPEG_REPO: https://x-access-token:${{ secrets.FFMPEG_PAT }}@github.com/hoon720823/ffmpeg-patch.git
          GIT_BRANCH: master
        run: |
          chmod +x ./build-macos.sh
          ./build-macos.sh ${{ matrix.arch }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-macos-${{ matrix.arch }}-gpl-shared-8.1
          overwrite: true
          path: artifacts/*
  publish_release:
    name: Publish release
    # publish 조건: build_ffmpeg (linux/win) 가 success 이면 진행. macOS 는 best-effort —
    # 성공 시 artifact 자동 attach, 실패 시 publish 자체는 그대로 (linux/win 만).
    if: ${{ !cancelled() && github.event.inputs.buildOnly != 'true' && needs.build_ffmpeg.result == 'success' }}
    needs: [build_ffmpeg, build_ffmpeg_macos]
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk-Space
        run: df -h && sudo apt-get clean && docker system prune -a -f && sudo rm -rf /opt/ghc /usr/local/.ghcup /usr/local/lib/android && df -h
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ffmpeg-*
          merge-multiple: true
          path: artifacts
      - name: Generate release notes
        id: notes
        run: |
          set -xe
          shopt -s nullglob

          # Extract source describe from a sample artifact name.
          # win64 → fms-ffmpeg-8.1-1-1-gd72f9a9-win64-gpl-shared-8.1.zip → fms-ffmpeg-8.1-1-1-gd72f9a9
          SAMPLE=""
          for p in artifacts/ffmpeg-*-win64-*.zip artifacts/ffmpeg-*-linux64-*.tar.xz artifacts/ffmpeg-*-macos-*.tar.xz; do
              if [[ -f "$p" ]]; then SAMPLE="$p"; break; fi
          done
          if [[ -n "$SAMPLE" ]]; then
              DESCRIBE=$(basename "$SAMPLE" | sed -E 's/^ffmpeg-//; s/-(win64|winarm64|linux64|linuxarm64|macos-amd64|macos-arm64)-gpl-shared-8\.1\.(zip|tar\.xz)$//')
          else
              DESCRIBE="(unknown — no sample artifact)"
          fi
          BUILD_DATE_UTC="$(date -u +'%Y-%m-%d %H:%M UTC')"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          cat > release-notes.md <<EOF
# fms-ffmpeg autobuild — \`$DESCRIBE\`

\`hoon720823/ffmpeg-patch\` 의 master HEAD 자동 빌드. fms-agent 의 ABR seamless reconfigure (ZMQ enc-bridge) 용 fork.

## 이 빌드 정보

| 항목 | 값 |
|------|------|
| **Source repo** | https://github.com/hoon720823/ffmpeg-patch |
| **Source branch** | \`master\` |
| **Source describe** | \`$DESCRIBE\` |
| **Upstream base** | ffmpeg \`n8.1.1\` (mainline) |
| **Build workflow** | [run #${{ github.run_id }}]($RUN_URL) |
| **Build date (UTC)** | $BUILD_DATE_UTC |
| **Variant** | \`gpl-shared 8.1\` (DLL split) |

## 들어있는 것 — fms 전용 patch (\`abr-zmq-patches\`)

mainline ffmpeg 위에 fms 운영용 patch:

| 파일 | 변경 |
|------|------|
| \`libavfilter/zmq_enc_cmd.h\` | callback 인터페이스 header (신규) |
| \`libavfilter/f_zmq.c\` | ZMQ filter 가 \`@enc_<idx>\` prefix 명령 인식 → callback dispatch |
| \`libavfilter/Makefile\` | build 통합 |
| \`fftools/ffmpeg.c\` | callback 등록 (\`fms_apply_enc_cmd\`) — \`AVCodecContext->bit_rate / rc_max_rate / rc_min_rate / rc_buffer_size\` 직접 mutation |

### 동작

1. agent 가 ZMQ REQ → ffmpeg f_zmq.c REP socket (default \`tcp://*:5555\`) 에 명령 송신
2. \`@enc_<idx>\` prefix 검출 시 callback 호출 → stream_idx → AVCodecContext 매핑 + field mutation
3. REP \`0 dispatched\` 반환
4. 다음 frame 처리 시 인코더 wrapper (libx264 / nvenc / libx265) 가 ctx 변화 자동 감지 → \`x264_encoder_reconfig\` / \`NvEncReconfigureEncoder\` 자동 호출 (mainline 동작)

### 명령 형식

\`\`\`
@enc_<output_stream_idx> <option> <value>

예:
  @enc_0 b 1500k         # AVCodecContext->bit_rate
  @enc_0 maxrate 1800k   # rc_max_rate
  @enc_0 minrate 800k    # rc_min_rate
  @enc_0 bufsize 3600k   # rc_buffer_size
\`\`\`

기존 ZMQ filter 옵션 명령 (\`Parsed_scale_0 width 640\` 등) 도 그대로 동작 — 본 patch 는 추가만.

## 빌드된 platform

| platform | 파일 패턴 |
|----------|-----------|
| windows / amd64 | \`*-win64-gpl-shared-8.1.zip\` |
| windows / arm64 | \`*-winarm64-gpl-shared-8.1.zip\` (미검증) |
| linux / amd64 | \`*-linux64-gpl-shared-8.1.tar.xz\` |
| linux / arm64 | \`*-linuxarm64-gpl-shared-8.1.tar.xz\` |
| macOS / intel | \`*-macos-amd64-gpl-shared-8.1.tar.xz\` |
| macOS / Apple Silicon | \`*-macos-arm64-gpl-shared-8.1.tar.xz\` |
| 무결성 | \`checksums.sha256\` |

## 사용 (ffmpeg 교체)

**Windows**
\`\`\`powershell
Expand-Archive ffmpeg-*-win64-gpl-shared-8.1.zip -DestinationPath C:\\
Rename-Item C:\\ffmpeg-*-win64-gpl-shared-8.1 C:\\ffmpeg
\$env:Path += ";C:\\ffmpeg\\bin"
ffmpeg -version  # → "ffmpeg version $DESCRIBE-..." 확인
\`\`\`

**Linux**
\`\`\`bash
tar -xJf ffmpeg-*-linux64-gpl-shared-8.1.tar.xz -C /opt
sudo ln -sf /opt/ffmpeg-*-linux64-gpl-shared-8.1/bin/ffmpeg /usr/local/bin/ffmpeg
ffmpeg -version
\`\`\`

**macOS** (unsigned binary — Gatekeeper 우회 필요)
\`\`\`bash
tar -xJf ffmpeg-*-macos-\$(uname -m)-gpl-shared-8.1.tar.xz -C /opt
sudo ln -sf /opt/ffmpeg-*-macos-*-gpl-shared-8.1/bin/ffmpeg /usr/local/bin/ffmpeg
sudo xattr -dr com.apple.quarantine /opt/ffmpeg-*-macos-*-gpl-shared-8.1
ffmpeg -version
\`\`\`

## 무결성

\`\`\`
sha256sum -c checksums.sha256        # linux/macOS
Get-FileHash *.zip -Algorithm SHA256  # windows
\`\`\`

## Source / 관련

- ffmpeg source: [hoon720823/ffmpeg-patch](https://github.com/hoon720823/ffmpeg-patch) @ \`master\`
- builder: [hoon720823/FFmpeg-Builds](https://github.com/hoon720823/FFmpeg-Builds)
- 사용처: [funzun-media-server fms-agent](https://github.com/hoon720823/funzun-media-server)
EOF

          echo "describe=$DESCRIBE" >> $GITHUB_OUTPUT

      - name: Create release
        id: create_release
        run: |
          set -xe
          shopt -s nullglob
          RELDATE="$(date +'%Y-%m-%d %H:%M')"
          NAME="Auto-Build $RELDATE"
          TAGNAME="autobuild-$(date +'%Y-%m-%d-%H-%M')"
          (cd artifacts && sha256sum *.{zip,tar.xz} > checksums.sha256)
          gh release create "$TAGNAME" --target "master" --title "$NAME" \
            --notes-file release-notes.md \
            artifacts/*.{zip,tar.xz} artifacts/checksums.*
          echo "tag_name=${TAGNAME}" >> $GITHUB_OUTPUT
          echo "rel_date=${RELDATE}" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Update Latest
        run: |
          set -xe
          shopt -s nullglob
          mkdir latest_artifacts
          ./util/repack_latest.sh latest_artifacts artifacts/*.{zip,tar.xz}
          (cd latest_artifacts && sha256sum *.{zip,tar.xz} > checksums.sha256)
          NAME="Latest Auto-Build (${{ steps.create_release.outputs.rel_date }})"
          TAGNAME="latest"
          gh release delete --cleanup-tag --yes "$TAGNAME" || true
          sleep 15
          gh release create "$TAGNAME" --target "master" --title "$NAME" \
            --notes-file release-notes.md \
            latest_artifacts/*
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Update Wiki
        run: ./util/update_wiki.sh artifacts ${{ steps.create_release.outputs.tag_name }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Prune old releases
        run: ./util/prunetags.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
